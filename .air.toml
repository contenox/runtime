root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -ldflags \"-X github.com/contenox/runtime/runtime/contenoxcli.Version=dev\" -o ./bin/contenox ./cmd/contenox"
entrypoint = ["true"]
include_ext = ["go", "json"]
exclude_dir = [".git", "tmp", "bin", "target"]
exclude_regex = ["_test\\.go"]
delay = 500
stop_on_error = true
send_interrupt = false
kill_delay = "100ms"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
